<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Michelle Wolff Consulting — Website Wireframes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; overflow: hidden; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    #root { width: 100%; height: 100vh; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="wireframes/shared.jsx"></script>
  <script type="text/babel" src="wireframes/direction-1.jsx"></script>
  <script type="text/babel" src="wireframes/direction-2.jsx"></script>
  <script type="text/babel" src="wireframes/direction-3.jsx"></script>
  <script type="text/babel" src="wireframes/direction-4.jsx"></script>

  <script type="text/babel">
    const HOME_W = 1280;
    const HOME_H = 3300;
    const CONTACT_W = 1280;
    const CONTACT_H = 1280;

    function App() {
      return (
        <DesignCanvas
          title="Michelle Wolff Consulting — Website Wireframes"
          subtitle="Four directions, low-fi. Each shows the one-page home + the dedicated Contact / Booking page side-by-side."
        >
          <DCSection
            id="d1"
            title="01 · Editorial Spread"
            subtitle="Magazine-like asymmetry · numbered features · pull quotes · most aligned to Rachel Tyler ref"
          >
            <DCArtboard id="d1-home" label="Home — one-page" width={HOME_W} height={HOME_H}>
              <D1_Home />
            </DCArtboard>
            <DCArtboard id="d1-contact" label="Contact / Booking" width={CONTACT_W} height={CONTACT_H}>
              <D1_Contact />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="d2"
            title="02 · The Statement"
            subtitle="Manifesto-driven · type-led · massive metrics as design · dark mode, sparse imagery"
          >
            <DCArtboard id="d2-home" label="Home — one-page" width={HOME_W} height={HOME_H + 400}>
              <D2_Home />
            </DCArtboard>
            <DCArtboard id="d2-contact" label="Contact / Booking" width={CONTACT_W} height={CONTACT_H + 80}>
              <D2_Contact />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="d3"
            title="03 · Personal & Warm"
            subtitle="Story-first · two-column reads · friendlier tone · more photos throughout · soft peach palette"
          >
            <DCArtboard id="d3-home" label="Home — one-page" width={HOME_W} height={HOME_H + 200}>
              <D3_Home />
            </DCArtboard>
            <DCArtboard id="d3-contact" label="Contact / Booking" width={CONTACT_W} height={CONTACT_H + 40}>
              <D3_Contact />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="d4"
            title="04 · Index / Directory"
            subtitle="Archival monograph feel · sticky side-nav · numbered sections · dense, sophisticated, table-led"
          >
            <DCArtboard id="d4-home" label="Home — one-page" width={HOME_W} height={HOME_H + 100}>
              <D4_Home />
            </DCArtboard>
            <DCArtboard id="d4-contact" label="Contact / Booking" width={CONTACT_W} height={CONTACT_H + 40}>
              <D4_Contact />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
